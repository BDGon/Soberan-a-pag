<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Control de asistencia · 1.er Encuentro Regional por la Soberanía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bar:#1f4e79;--ink:#12324f;--txt:#3d5a80;--btn:#4a7de6;--celeste:#2b8fd6;--ok:#146c43;--red:#b3261e;--mist:#e6edf3;--foot:#1b2338;
 --display:'Bebas Neue','Arial Narrow',Impact,sans-serif;--sans:'Inter',system-ui,sans-serif;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#fff}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--celeste);outline-offset:2px}
.top{background:var(--bar);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:inline-flex;align-items:center;gap:10px;background:#1c1a17;padding:8px 14px}
.mark span{font-family:var(--display);color:#fff;font-size:1.25rem;line-height:1;letter-spacing:.02em}
.flag{width:34px;height:26px;background:linear-gradient(#2b8fd6 0 33%,#fff 33% 66%,#2b8fd6 66%)}
.top a{color:#fff;font-size:.85rem}
main{max-width:720px;margin:0 auto;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
h1{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;margin:0 0 6px;color:var(--bar)}
.sub{margin:0 0 18px;color:var(--txt)}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 6px}
input{width:100%;font:inherit;padding:12px 14px;border:1.5px solid #b9c6d2;border-radius:10px;background:#fff;color:var(--ink)}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--btn);color:#fff;font:600 .95rem var(--sans);text-transform:uppercase;letter-spacing:.02em;cursor:pointer}
.btn.full{width:100%;margin-top:16px}
.btn.alt{background:var(--mist);color:var(--ink)}
.btn[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.2em;margin:12px 0 0;font-size:.95rem}
.msg.err{color:var(--red)}.msg.ok{color:var(--ok);font-weight:600}
.box{border:1px solid #d3dde6;border-radius:14px;padding:18px;margin-bottom:18px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;border:1.5px solid #9cc3e6;border-radius:12px;padding:10px;text-align:center;background:rgba(43,143,214,.07)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1}
.stat small{color:var(--txt)}
.stat.p{border-color:#7fc8a0;background:rgba(20,108,67,.07)}.stat.p b{color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:180px}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{padding:8px 14px;border:1.5px solid #b9c6d2;border-radius:999px;background:#fff;color:var(--ink);font:500 .9rem var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid #d3dde6;border-left:4px solid #b9c6d2;border-radius:10px}
.item.here{border-left-color:var(--ok);background:rgba(20,108,67,.05)}
.item strong{display:block;line-height:1.25}
.item small{display:block;color:var(--txt);word-break:break-all}
.item .ok{color:var(--ok);font-weight:600}
.item .btn{white-space:nowrap;padding:10px 12px}
.empty{padding:18px;text-align:center;color:var(--txt)}
details.box summary{cursor:pointer;font-family:var(--display);font-size:1.6rem;color:var(--bar);letter-spacing:.02em}
</style>
</head>
<body>
<header class="top">
  <div class="mark"><span>ENCUENTRO REGIONAL<br>POR LA SOBERANÍA</span><i class="flag" aria-hidden="true"></i></div>
  <span><a href="index.html">Inscripción</a> <a href="#" id="salir" hidden style="margin-left:12px">Salir</a></span>
</header>

<main>
  <h1>Control de asistencia</h1>

  <section id="login" class="box">
    <p class="sub">Acceso exclusivo de la organización.</p>
    <form id="fl">
      <label for="u">Usuario</label>
      <input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label for="p">Contraseña</label>
      <input id="p" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button class="btn full" type="submit">Ingresar</button>
      <p class="msg" id="lmsg" role="status"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="stats">
      <div class="stat p"><b id="sp">0</b><small>Presentes</small></div>
      <div class="stat"><b id="sf">0</b><small>Faltan</small></div>
      <div class="stat"><b id="st">0</b><small>Total</small></div>
    </div>

    <details class="box" id="addbox">
      <summary>Agregar asistente</summary>
      <p class="sub">Para quien se presenta sin inscripción previa. Queda registrado como presente.</p>
      <form id="fa">
        <label for="an">Nombre y apellido</label>
        <input id="an" autocomplete="off" required>
        <label for="at">Teléfono (opcional)</label>
        <input id="at" type="tel" inputmode="tel" autocomplete="off">
        <label for="ac">Correo electrónico (opcional)</label>
        <input id="ac" type="email" autocomplete="off" autocapitalize="none">
        <button class="btn full" id="addbtn" type="submit">Agregar y marcar presente</button>
        <p class="msg" id="amsg" role="status"></p>
      </form>
    </details>

    <div class="tools">
      <input id="q" type="search" placeholder="Buscar por nombre, correo o teléfono" aria-label="Buscar">
      <button class="btn alt" id="refresh" type="button">Actualizar</button>
      <button class="btn alt" id="csv" type="button">CSV</button>
    </div>
    <div class="chips" role="group" aria-label="Filtro">
      <button class="chip" data-f="all" aria-pressed="true">Todos</button>
      <button class="chip" data-f="here" aria-pressed="false">Presentes</button>
      <button class="chip" data-f="missing" aria-pressed="false">Faltan</button>
    </div>
    <p class="msg" id="gmsg" role="status"></p>
    <ul class="list" id="list"></ul>
  </section>
</main>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzn3AJxYcZg5P4qaTxAWZUMhEWaMBUoU8xYJWsWo8sP71BT3T-hJVe5Uy1xcWIc2Sk-3w/exec';
const $ = id => document.getElementById(id);
let creds = null, rows = [], filter = 'all';

async function api(body){
  const r = await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},creds,body))});
  return r.json();
}
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora = f => f ? f.slice(-5) : '';

async function load(){
  $('gmsg').className='msg';$('gmsg').textContent='Cargando…';
  try{
    const r = await api({action:'attendees'});
    if(!r.ok){$('gmsg').className='msg err';$('gmsg').textContent='No se pudo cargar la lista.';return false;}
    rows = r.rows; $('gmsg').textContent=''; draw(); return true;
  }catch(_){$('gmsg').className='msg err';$('gmsg').textContent='Sin conexión con la planilla.';return false;}
}

function draw(){
  const q=$('q').value.trim().toLowerCase();
  const here=rows.filter(r=>r.presente).length;
  $('sp').textContent=here; $('sf').textContent=rows.length-here; $('st').textContent=rows.length;
  const v=rows.filter(r=>
    (filter==='all'||(filter==='here')===!!r.presente) &&
    (!q||(r.nombre+' '+r.correo+' '+r.telefono).toLowerCase().includes(q)));
  $('list').innerHTML=v.map(r=>'<li class="item'+(r.presente?' here':'')+'">'
    +'<div><strong>'+esc(r.nombre)+'</strong>'
    +(r.correo?'<small>'+esc(r.correo)+'</small>':'')+(r.telefono?'<small>'+esc(r.telefono)+'</small>':'')
    +(r.presente?'<small class="ok">Presente · '+esc(hora(r.presente))+(r.origen==='Carga manual'?' · carga manual':'')+'</small>':'')+'</div>'
    +'<button class="btn'+(r.presente?' alt':'')+'" data-row="'+r.row+'">'+(r.presente?'Deshacer':'Marcar presente')+'</button></li>').join('')
    ||'<li class="empty">Sin resultados.</li>';
}

async function entrar(c,manual){
  creds=c;
  try{
    const r=await api({action:'attendees'});
    if(!r.ok){
      creds=null;try{sessionStorage.removeItem('cred');}catch(_){}
      if(manual){$('lmsg').className='msg err';$('lmsg').textContent='Usuario o contraseña incorrectos.';}
      return false;
    }
    rows=r.rows;$('login').hidden=true;$('app').hidden=false;$('salir').hidden=false;$('p').value='';draw();
    try{sessionStorage.setItem('cred',JSON.stringify(c));}catch(_){}
    if(location.hash==='#agregar'){$('addbox').open=true;$('addbox').scrollIntoView();$('an').focus();}
    return true;
  }catch(_){
    creds=null;
    if(manual){$('lmsg').className='msg err';$('lmsg').textContent='No se pudo conectar con la planilla.';}
    return false;
  }
}
$('fl').addEventListener('submit',e=>{
  e.preventDefault();
  $('lmsg').className='msg';$('lmsg').textContent='Verificando…';
  entrar({user:$('u').value.trim(),pass:$('p').value},true);
});
$('salir').addEventListener('click',e=>{e.preventDefault();try{sessionStorage.removeItem('cred');}catch(_){}location.reload();});
// Si ya se ingresó en el panel de la organización, entra directo
try{
  const c=JSON.parse(sessionStorage.getItem('cred')||'null');
  if(c&&c.user&&c.pass){$('lmsg').textContent='Ingresando…';entrar(c,false).then(ok=>{if(!ok)$('lmsg').textContent='';});}
}catch(_){}

$('list').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-row]'); if(!b) return;
  const r=rows.find(x=>x.row===Number(b.dataset.row)); if(!r) return;
  b.disabled=true;
  try{
    const res=await api({action:'checkin',row:r.row,nombre:r.nombre,presente:!r.presente});
    if(res.ok){r.presente=res.presente;draw();}
    else{$('gmsg').className='msg err';$('gmsg').textContent=res.error||'No se pudo guardar.';b.disabled=false;}
  }catch(_){$('gmsg').className='msg err';$('gmsg').textContent='Sin conexión. Reintentá.';b.disabled=false;}
});

$('fa').addEventListener('submit',async e=>{
  e.preventDefault();
  const m=$('amsg'),btn=$('addbtn');
  const d={action:'addAttendee',nombre:$('an').value.trim(),telefono:$('at').value.trim(),correo:$('ac').value.trim()};
  if(d.nombre.length<3){m.className='msg err';m.textContent='Ingresá el nombre completo.';return;}
  btn.disabled=true;m.className='msg';m.textContent='Guardando…';
  try{
    const r=await api(d);
    if(r.ok){
      rows.push({row:r.row,fecha:r.fecha,nombre:d.nombre,telefono:d.telefono,correo:d.correo.toLowerCase(),presente:r.fecha,origen:'Carga manual'});
      e.target.reset();draw();m.className='msg ok';m.textContent='Asistente agregado y marcado como presente.';
    }else{m.className='msg err';m.textContent=r.error||'No se pudo agregar.';}
  }catch(_){m.className='msg err';m.textContent='Sin conexión. Reintentá.';}
  btn.disabled=false;
});

$('q').addEventListener('input',draw);
$('refresh').onclick=load;
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));draw();});
$('csv').onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"';
  const csv='\ufeff'+[['Nombre','Telefono','Correo','Presente','Origen'],...rows.map(r=>[r.nombre,r.telefono,r.correo,r.presente,r.origen])].map(r=>r.map(q).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='asistencia.csv';a.click();
};
</script>
</body>
</html>
